framework:
    rate_limiter:
        registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
            cache_pool: cache.app
        upload:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
            cache_pool: cache.app
        message:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
            cache_pool: cache.app
        report:
            policy: sliding_window
            limit: 20
            interval: '1 day'
            cache_pool: cache.app

when@test:
    framework:
        rate_limiter:
            registration:
                policy: sliding_window
                limit: 1000
                interval: '1 hour'
            upload:
                policy: sliding_window
                limit: 1000
                interval: '1 hour'
            message:
                policy: sliding_window
                limit: 1000
                interval: '1 minute'
            report:
                policy: sliding_window
                limit: 1000
                interval: '1 day'
