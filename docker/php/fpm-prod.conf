[www]
; Sized for a small instance (~512 MB for PHP). Raise pm.max_children with the available memory.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.status_path = /fpm-status
request_terminate_timeout = 30s
catch_workers_output = yes
decorate_workers_output = no
