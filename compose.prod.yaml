# Production stack. Usage: `make prod-deploy` (see docs/DEPLOY.md).
# Every secret comes from .env.prod; the app refuses to boot on development defaults.
name: rasoherina-prod

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-app-env: &app-env
  APP_ENV: prod
  APP_DEBUG: "0"
  APP_SECRET: ${APP_SECRET:?run "make secrets"}
  DATABASE_URL: postgresql://app:${DB_PASSWORD:?}@database:5432/app?serverVersion=16&charset=utf8
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  MESSENGER_TRANSPORT_DSN: redis://:${REDIS_PASSWORD}@redis:6379/messages
  MERCURE_URL: http://mercure/.well-known/mercure
  MERCURE_PUBLIC_URL: https://${DOMAIN:?}/.well-known/mercure
  MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?}
  UPLOADS_BASE_URL: https://${DOMAIN}/uploads
  JWT_PASSPHRASE: ${JWT_PASSPHRASE:?}
  CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?}
  API_DOCS_ENABLED: "0"

x-app: &app
  build:
    context: .
    target: prod
  image: rasoherina-app:prod
  restart: unless-stopped
  logging: *logging
  environment:
    <<: *app-env

services:
  nginx:
    build:
      context: .
      target: nginx-prod
    image: rasoherina-nginx:prod
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_ENVSUBST_FILTER: ^DOMAIN$$
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - uploads:/var/www/app/public/uploads:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app
      - mercure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0" # migrations are an explicit step: `make prod-migrate`
    volumes:
      - uploads:/var/www/app/public/uploads
      - jwt:/var/www/app/config/jwt
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    user: "82:82" # www-data
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=192M", "-vv"]
    stop_grace_period: 30s
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_healthy }

  migrate:
    <<: *app
    restart: "no"
    profiles: ["tools"]
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--allow-no-migration"]
    depends_on:
      database: { condition: service_healthy }

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  mercure:
    # Pinned: protocol 0.x (the Symfony bundle is configured with protocol_version 0.x).
    image: dunglas/mercure@sha256:916834e499613d475e9ad5118cd2349875338f52d99d65b58aeff82f97ccb0c6
    restart: unless-stopped
    logging: *logging
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      # Public updates (dishes/reviews that are public) may be read anonymously; private topics
      # (/users/{id}/notifications) always require a subscriber token issued by the API.
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        cors_origins https://${DOMAIN}
    volumes:
      - mercure_data:/data
      - mercure_config:/config

volumes:
  uploads:
  jwt:
  db_data:
  redis_data:
  mercure_data:
  mercure_config:
  certbot_www:
